<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<meta name="description" content="Hot Take Spectrum. A party game for one shared phone. Works offline.">
<title>Hot Take Spectrum</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{color-scheme:dark;--bg:#0f1220;--panel:#1b2036;--text:#f2f4ff;--dim:#9aa3c7;--accent:#ff4d6d;--gold:#ffd166;--ok:#4dd6a4;--line:#2c3354;--on:#fff;--out:cubic-bezier(.2,.8,.2,1)}
[data-theme=ocean]{--bg:#06202e;--panel:#0d3347;--text:#eaf8ff;--dim:#8fb8cc;--accent:#14b8e6;--ok:#5eead4;--line:#17506b}
[data-theme=forest]{--bg:#0e1a12;--panel:#17291d;--text:#eefaf0;--dim:#9bbfa4;--accent:#3fb950;--ok:#a3e635;--line:#25402d}
[data-theme=sunset]{--bg:#1f1020;--panel:#33182f;--text:#fff1ea;--dim:#d1a3b0;--accent:#ff7a3d;--ok:#ffd166;--line:#52284a}
[data-theme=grape]{--bg:#150f26;--panel:#241a40;--text:#f5f0ff;--dim:#b3a5d9;--accent:#a855f7;--ok:#f0abfc;--line:#3b2d66}
[data-theme=mono]{--bg:#000;--panel:#161616;--text:#fff;--dim:#9a9a9a;--accent:#fff;--ok:#fff;--line:#2b2b2b;--on:#000}
[data-theme=light]{color-scheme:light;--bg:#f4f5fb;--panel:#fff;--text:#1a1d2e;--dim:#6b7194;--accent:#e63e5c;--ok:#12a77a;--line:#d9dcee}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:17px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;color:var(--text);border:0;border-radius:14px;padding:14px;cursor:pointer;touch-action:manipulation;transition:transform 150ms var(--out),opacity .2s;background:var(--panel)}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.35;cursor:default}
input[type=text]{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;min-width:0;-webkit-user-select:text;user-select:text}
select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%}
main{max-width:520px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;min-height:100vh;min-height:100dvh}
h1{margin:6px 0 0;font-size:30px;line-height:1.1;text-align:center}
h1 b{color:var(--accent)}
h2{margin:0;font-size:15px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.sub{text-align:center;color:var(--dim);margin:0}
.panel{background:var(--panel);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.primary{background:var(--accent);color:var(--on);font-weight:700;padding:16px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 13px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:15px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:600}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center}
.stage.enter>*{animation:in 320ms var(--out) both}
.stage.enter>*:nth-child(2){animation-delay:70ms}.stage.enter>*:nth-child(3){animation-delay:140ms}.stage.enter>*:nth-child(4){animation-delay:210ms}
.stage.enter .big{animation:pop 520ms cubic-bezier(.34,1.56,.64,1) 120ms both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
.bar i{animation:grow 650ms var(--out) both;animation-delay:calc(var(--d,0)*90ms + 250ms)}
.names button{animation:in 300ms var(--out) both;animation-delay:calc(var(--d,0)*45ms)}
.panel,.primary{animation:in 300ms var(--out) both}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);padding:14px;border-radius:12px;cursor:pointer;transition:transform 150ms var(--out)}
.tog:active{transform:scale(.98)}
.tog input{width:24px;height:24px;margin:0;flex:none;accent-color:var(--accent);cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent);padding:0;border:0;background:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.lead{font-size:27px;font-weight:700;line-height:1.2}
.big{font-size:42px;font-weight:800;color:var(--gold);line-height:1.1}
.dim{color:var(--dim);font-size:15px}
.top{display:flex;justify-content:space-between;align-items:center}
.link{background:none;color:var(--dim);padding:8px 4px}
.score{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.score span{background:var(--panel);border-radius:999px;padding:5px 12px;font-size:14px}
.x{background:none;padding:0 2px;color:var(--dim)}
.prow{display:flex;gap:8px;align-items:center}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names button{padding:18px 8px;font-size:19px;font-weight:600;border:1px solid var(--line)}
.names button:disabled{opacity:.25}
.bar{display:grid;grid-template-columns:90px 1fr 28px;gap:8px;align-items:center;text-align:left;font-size:16px}
.bar i{display:block;height:20px;border-radius:10px;background:var(--accent);min-width:4px;transition:width .6s var(--out)}
.bar.win i{background:var(--gold)}
.bar.win b{color:var(--gold)}
.bar b{text-align:right}
.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wheel{position:relative;height:132px;margin:0 auto;width:140px}
.wheel:before{content:"";position:absolute;left:0;right:0;top:44px;height:44px;border-radius:12px;background:var(--bg);border:1px solid var(--accent);pointer-events:none}
.wheel:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--panel) 0,transparent 38%,transparent 62%,var(--panel) 100%)}
.wheel ul{list-style:none;margin:0;padding:44px 0;height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;position:relative;z-index:1;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.wheel ul::-webkit-scrollbar{display:none}
.wheel li{height:44px;line-height:44px;text-align:center;font-size:22px;color:var(--dim);scroll-snap-align:center;scroll-snap-stop:always;cursor:pointer;transition:color .15s,font-size .15s}
.wheel li.sel{color:var(--text);font-weight:800;font-size:28px}
.dot{position:absolute;transform:translateX(-50%);text-align:center;font-size:12px;white-space:nowrap}
.dot i{display:block;width:16px;height:16px;margin:4px auto 0;border-radius:50%;background:var(--accent);animation:pop 480ms cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--d,0)*110ms + 250ms)}
.dot span{animation:in 300ms var(--out) both;animation-delay:calc(var(--d,0)*110ms + 400ms)}
.avg{animation:grow2 500ms var(--out) both 150ms;transform-origin:top}
@keyframes grow2{from{transform:scaleY(0)}}
#lv{transition:color .15s}
.how{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.how li{animation:in 300ms var(--out) both;animation-delay:calc(var(--i)*60ms)}
</style></head>
<body><main id="app"></main>
<script>
const KEY='hottake-v1';
const PROMPTS={
fun:["Pineapple belongs on pizza","Cereal is a soup","A hot dog is a sandwich","Water is wet","Ketchup is a spice","Breakfast is the best meal of the day","Mornings are better than nights","Cats are better than dogs","The beach beats the mountains","Summer beats winter","Movies are better in a theater","Sequels are usually better than the original","The book is always better than the movie","Cilantro tastes like soap","Gas station sushi is a great idea","Socks with sandals is fine","Texting beats calling","Voice messages are annoying","Dark mode is better than light mode","Pizza is the perfect food","Brunch is overrated","Mint chocolate chip is a great ice cream","Raisins in cookies is a crime","Everyone should learn to cook","Tipping culture has gone too far","A group chat should never be muted","Being early is better than being on time","It's okay to reply 'k'","Spoilers don't ruin anything","Reality TV is a guilty pleasure worth having","Tacos are better than burgers","Hawaiian pizza is a disgrace","Crunchy peanut butter beats smooth","You should always finish a movie you started","Shower in the morning beats at night","Fast food is underrated","Sleeping in is a talent","Cold pizza is better than hot","Soda is better than juice","Winter is the best season"],
life:["College is worth the money","Remote work beats the office","Everyone should travel solo once","Marriage is outdated","Money can buy happiness","Social media does more harm than good","People should live with their parents until they marry","Your twenties are the best years of your life","Having a plan matters more than winging it","Success comes from luck, not talent","First impressions are always right","Friends are more important than family","Everyone deserves a second chance","It's okay to ghost someone","Young people are lazier than older generations","Zoos are cruel","Cell phones should be banned in schools","Homework should be abolished","You should text first, always","Privacy is dead","AI will make life better","Self-driving cars are safe enough","Keeping a diary is a waste","Birthdays stop mattering after 25","Running a business beats having a job","Naps are for the weak","Tiny houses are the future","Gen Z is more honest than millennials","Pets should be allowed everywhere","You can't be friends with an ex"],
spicy:["It's fine to date a friend's ex","Splitting the bill evenly is unfair","Weddings are a waste of money","Honesty is always the best policy","White lies are fine","It's okay to check your partner's phone","Jealousy means you care","Love at first sight is real","Long-distance relationships work","People never really change","Cheating once is a dealbreaker","You should marry your best friend","Money matters more than looks","Dating apps are better than meeting in person","A first kiss should happen on the first date","It's fine to ask someone out over text","Sharing a bed is better than separate rooms","Being single is better than a bad relationship","Pre-nups are a smart idea","You should be friends with your coworkers","It's okay to cancel plans last-minute","Revenge is justified sometimes","It's fine to read someone's diary if you're worried","Celebrities deserve privacy","It's rude to talk about your salary"]};
const END=['Strongly disagree','Strongly agree'];
const THEMES=['default','ocean','forest','sunset','grape','mono','light'];
const def={players:['','',''],cats:{fun:true,life:true,spicy:true},theme:'default',rounds:12,mode:'avg',sound:true,vibe:true,vol:.6};
let S;try{S=Object.assign({},def,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=Object.assign({},def)}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let ac;
function ensureAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}
function tone(f,d,{type='sine',vol=1,slide=0,delay=0}={}){if(!S.sound||!ac)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol*S.vol*.35,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,f0,f1,vol=1,delay=0){if(!S.sound||!ac)return;const t=ac.currentTime+delay,n=ac.sampleRate*d|0,buf=ac.createBuffer(1,n,ac.sampleRate),x=buf.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const src=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();src.buffer=buf;fl.type='bandpass';fl.Q.value=1.2;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol*S.vol*.35,t+d*.6);g.gain.exponentialRampToValueAtTime(.0001,t+d);src.connect(fl);fl.connect(g);g.connect(ac.destination);src.start(t)}
const bell=(f,delay=0,len=1)=>{tone(f,.9*len,{vol:.8,delay});tone(f*2.76,.5*len,{vol:.22,delay})};
let tapT;const named=fn=>(...a)=>{clearTimeout(tapT);fn(...a)};
const sfx={tap:()=>tone(1200,.04,{vol:.5}),tick:()=>tone(900,.03,{type:'square',vol:.3}),
vote:named(()=>[523.25,659.25,783.99].forEach((f,i)=>tone(f,.25,{vol:.7,delay:i*.08}))),
dot:(i)=>tone(600+i*90,.12,{vol:.5,delay:.25+i*.11}),
pass:named(()=>{noise(.25,400,2600,1.4);bell(659.25,.16)}),
reveal:named(()=>{noise(.3,300,3000,2.2);bell(880,.22)}),
win:named(()=>[523.25,659.25,783.99,1046.5].forEach((f,i)=>bell(f,i*.09,.8))),
start:named(()=>{bell(784,0,.8);bell(988,.12,.8)})};
function buzz(p){try{if(S.vibe&&navigator.vibrate)navigator.vibrate(p)}catch(e){}}
document.addEventListener('click',e=>{if(e.target.closest('button,input[type=checkbox]')){ensureAudio();tapT=setTimeout(sfx.tap,0)}},true);
const $=s=>document.querySelector(s);const app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const applyTheme=()=>document.documentElement.dataset.theme=S.theme==='default'?'':S.theme;
const avg=v=>v.reduce((a,b)=>a+b,0)/v.length;
// Returns indices of closest to the group average (the 'Mainstream' pick) and farthest from it (the 'Hot Take' pick), ties kept.
function judge(vals){const m=avg(vals);const d=vals.map(v=>Math.abs(v-m));const lo=Math.min(...d),hi=Math.max(...d);
return {mean:m,close:d.map((x,i)=>Math.abs(x-lo)<1e-9?i:-1).filter(i=>i>=0),far:hi<1e-9?[]:d.map((x,i)=>Math.abs(x-hi)<1e-9?i:-1).filter(i=>i>=0)}}
const label=v=>v<12?'Strongly disagree':v<38?'Disagree':v<=62?'Neutral':v<88?'Agree':'Strongly agree';
function wheel(el,vals,cur,fn){el.innerHTML='<ul tabindex=0 aria-label="Number of rounds">'+vals.map(n=>`<li data-v=${n}>${n}</li>`).join('')+'</ul>';
const ul=el.firstChild,H=44;let idx=Math.max(0,vals.indexOf(cur));
const mark=()=>[...ul.children].forEach((li,i)=>li.classList.toggle('sel',i===idx));
ul.scrollTop=idx*H;mark();
ul.onscroll=()=>{const i=Math.max(0,Math.min(vals.length-1,Math.round(ul.scrollTop/H)));if(i!==idx){idx=i;mark();sfx.tick();buzz(8);fn(vals[i])}};
ul.onclick=e=>{const li=e.target.closest('li');if(li)ul.scrollTo({top:[...ul.children].indexOf(li)*H,behavior:'smooth'})};
ul.onkeydown=e=>{const d=e.key==='ArrowDown'?1:e.key==='ArrowUp'?-1:0;if(d){e.preventDefault();ul.scrollTo({top:Math.max(0,Math.min(vals.length-1,idx+d))*H,behavior:'smooth'})}}}
let G=null;
function home(){applyTheme();G=null;
app.innerHTML=`<div class=top><button class=link id=how>How to Play</button><button class=link id=set>⚙ Settings</button></div>
<h1>Hot Take <b>Spectrum</b></h1><p class=sub>One shared phone. Slide your take in secret, then see who's mainstream and who's wild.</p>
<div class=panel><h2>Players</h2><div id=pl></div><button id=add>+ Add player</button></div>
<div class=panel><h2>Takes</h2><div class=row id=cats></div></div>
<div class=panel><h2>Rounds</h2><div id=rd class=wheel></div></div>
<div class=panel><h2>Who scores</h2><div class=row id=md></div><div class=dim id=mdd></div></div>
<button class=primary id=go>Start game</button>`;
const pl=$('#pl');const draw=()=>{pl.innerHTML=S.players.map((p,i)=>`<div class=prow style="margin-bottom:8px"><input type=text maxlength=14 placeholder="Player ${i+1}" value="${esc(p)}" data-i=${i}><button class=x data-r=${i} aria-label="Remove">✕</button></div>`).join('');
pl.querySelectorAll('input').forEach(e=>e.oninput=()=>{S.players[e.dataset.i]=e.value;save();chk()});
pl.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.players.splice(b.dataset.r,1);while(S.players.length<3)S.players.push('');save();draw();chk()});$('#add').disabled=S.players.length>=12};
const names=()=>S.players.map((s,i)=>s.trim()||"Player "+(i+1));
const chk=()=>$('#go').disabled=names().length<3||!Object.values(S.cats).some(Boolean);
draw();$('#add').onclick=()=>{S.players.push('');save();draw();pl.querySelectorAll('input')[S.players.length-1].focus()};
$('#cats').innerHTML=[['fun','Fun'],['life','Life'],['spicy','Spicy']].map(([c,n])=>`<button class=chip data-c=${c} aria-pressed=${S.cats[c]}>${n}</button>`).join('');
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.cats[b.dataset.c]=!S.cats[b.dataset.c];b.setAttribute('aria-pressed',S.cats[b.dataset.c]);save();chk()});
wheel($('#rd'),Array.from({length:38},(_,i)=>i+3),S.rounds,n=>{S.rounds=n;save()});
const MD={avg:['Closest to average','Point to whoever is closest to the group average.'],hot:['Furthest from average','Point to whoever has the wildest take.'],both:['Both','A point for the closest and a point for the wildest.']};
const mdraw=()=>{$('#md').innerHTML=Object.keys(MD).map(k=>`<button class=chip data-m=${k} aria-pressed=${S.mode===k}>${MD[k][0]}</button>`).join('');$('#mdd').textContent=MD[S.mode][1];
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;save();mdraw()})};mdraw();
$('#how').onclick=howto;$('#set').onclick=settings;$('#go').onclick=start;chk()}
function howto(){app.innerHTML=`<div class=top><button class=link id=bk>← Back</button><span></span></div><h1>How to Play</h1>
<div class=panel><ol class=how>${["Add 3 to 12 players and pick your take types, number of rounds and who scores.","Each round, a hot take appears. Read it out loud.","Pass the phone around. Each player slides from strongly disagree to strongly agree, in secret, then locks it in.","The reveal shows everyone's spot on the line and the group average.","Closest to the average is the most mainstream. Furthest from it has the hottest take.","Points go to the closest, the furthest, or both, depending on your setting.","Most points after all the rounds wins."].map((x,i)=>`<li style="--i:${i}">${x}</li>`).join('')}</ol></div><button class=primary id=bk2>Got it</button>`;
$('#bk').onclick=home;$('#bk2').onclick=home}
function settings(){app.innerHTML=`<div class=top><button class=link id=bk>← Back</button><span></span></div><h1>Settings</h1>
<div class=panel><h2>Color theme</h2><div class=row>${THEMES.map(t=>`<button class=chip data-t=${t} aria-pressed=${S.theme===t}>${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div>
<div class=panel><h2>Feedback</h2><label class=tog><span>Sound effects</span><input type=checkbox id=snd ${S.sound?'checked':''}></label><label class=tog><span>Vibration (Android only)</span><input type=checkbox id=vib ${S.vibe?'checked':''}></label><h2>Volume</h2><input type=range id=vol min=.1 max=1 step=.05 value=${S.vol} aria-label=Volume></div>`;
$('#snd').onchange=e=>{S.sound=e.target.checked;save();ensureAudio();sfx.tick()};$('#vib').onchange=e=>{S.vibe=e.target.checked;save();buzz(20)};$('#vol').oninput=e=>{S.vol=+e.target.value};$('#vol').onchange=()=>{save();ensureAudio();sfx.tick()};
$('#bk').onclick=home;document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.theme=b.dataset.t;save();applyTheme();settings()})}
function start(){ensureAudio();sfx.start();buzz(15);const players=S.players.map((s,i)=>s.trim()||"Player "+(i+1));let pool=[];for(const c of Object.keys(S.cats))if(S.cats[c])pool=pool.concat(PROMPTS[c]);
pool=shuffle(pool).slice(0,Math.min(S.rounds,pool.length));
G={players,pool,i:0,voter:0,vals:[],score:players.map(()=>0)};intro()}
function scoreBar(){return `<div class=score>${G.players.map((p,i)=>`<span>${esc(p)} ${G.score[i]}</span>`).join('')}</div>`}
function topBar(){return `<div class=top><span class=dim>Take ${G.i+1} / ${G.pool.length}</span><button class=link id=quit>End game</button></div>`}
function hookQuit(){const q=$('#quit');if(q)q.onclick=()=>{if(confirm('End the game?'))final()}}
function intro(){G.voter=0;G.vals=[];
app.innerHTML=`${topBar()}<div class="stage enter"><div class=dim>Hot take</div><div class=lead>"${esc(G.pool[G.i])}"</div><p class=dim>Pass the phone. Everyone slides in secret, from ${END[0].toLowerCase()} to ${END[1].toLowerCase()}.</p></div><button class=primary id=nx>Start sliding</button>${scoreBar()}`;hookQuit();$('#nx').onclick=()=>{sfx.pass();buzz(12);slide()}}
function slide(){const p=G.players[G.voter];
app.innerHTML=`${topBar()}<div class="stage enter"><div class=dim>${esc(p)}, where do you stand?</div><div class=lead>"${esc(G.pool[G.i])}"</div>
<div class=panel><input type=range id=sl min=0 max=100 value=50 style="width:100%;height:40px;accent-color:var(--accent)" aria-label="Agree level"><div class=top><span class=dim>${END[0]}</span><span class=dim>${END[1]}</span></div><div id=lv style="font-weight:700;font-size:20px;min-height:28px">Neutral</div></div></div>
<button class=primary id=ok>Lock it in</button><p class=dim style="text-align:center">Player ${G.voter+1} of ${G.players.length}</p>`;hookQuit();
let last=50,lastL=label(50);const sl=$('#sl');sl.oninput=()=>{const v=+sl.value,L=label(v);$('#lv').textContent=L;if(Math.abs(v-last)>=5){last=v;sfx.tick();buzz(6)}if(L!==lastL){lastL=L;sfx.tap();buzz(14)}};
$('#ok').onclick=()=>{sfx.vote();buzz([10,30,10]);G.vals.push(+sl.value);G.voter++;G.voter<G.players.length?handoff():reveal()}}
function handoff(){app.innerHTML=`${topBar()}<div class="stage enter"><div class=dim>Take locked in. Pass the phone to</div><div class=big>${esc(G.players[G.voter])}</div></div><button class=primary id=nx>I'm ${esc(G.players[G.voter])}, show me</button>`;hookQuit();$('#nx').onclick=()=>{sfx.pass();buzz(12);slide()}}
function reveal(){const j=judge(G.vals);const gc=S.mode!=='hot',gh=S.mode!=='avg';
if(gc)j.close.forEach(i=>G.score[i]++);if(gh)j.far.forEach(i=>G.score[i]++);
const nm=a=>a.map(i=>esc(G.players[i])).join(' & ');
const dots=G.vals.map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v);
// stagger dots vertically so overlapping players stay readable
const lanes=[];const pos=dots.map(d=>{let l=0;while(lanes[l]!==undefined&&Math.abs(lanes[l]-d.v)<14)l++;lanes[l]=d.v;return {...d,l}});
const H=Math.max(...pos.map(p=>p.l))*26+34;
app.innerHTML=`${topBar()}<div class="stage enter"><div class=dim>"${esc(G.pool[G.i])}"</div>
<div class=panel><div style="position:relative;height:${H+30}px;margin:8px 8px 0">
<div style="position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:var(--line)"></div>
<div class=avg style="position:absolute;left:${j.mean}%;top:0;width:3px;height:${H+24}px;background:var(--gold);border-radius:2px" title="Group average"></div>
${pos.map((p,k)=>`<div class=dot style="left:${p.v}%;top:${p.l*26}px;--d:${k}"><i></i><span>${esc(G.players[p.i])}</span></div>`).join('')}
</div><div class=top><span class=dim>${END[0]}</span><span class=dim style="color:var(--gold)">| group average</span><span class=dim>${END[1]}</span></div></div>
<div>${gc?`<div class=verdict style="color:var(--ok);font-weight:700">🎯 Most mainstream: ${nm(j.close)}</div>`:''}${gh&&j.far.length?`<div style="color:var(--accent);font-weight:700">🔥 Hottest take: ${nm(j.far)}</div>`:''}</div></div>
<button class=primary id=nx>${G.i+1<G.pool.length?'Next take':'Final results'}</button>${scoreBar()}`;hookQuit();sfx.reveal();buzz([20,40,40]);pos.forEach((_,k)=>sfx.dot(k));
$('#nx').onclick=()=>{if(G.i+1<G.pool.length){G.i++;intro()}else final()}}
function final(){const m=Math.max(...G.score);const order=G.score.map((n,i)=>i).sort((a,b)=>G.score[b]-G.score[a]);const w=G.score.map((n,i)=>n===m&&m>0?i:-1).filter(i=>i>=0);
app.innerHTML=`<h1>Game over</h1><div class="stage enter"><div class=dim>Winner</div><div class=big>${w.length?w.map(i=>esc(G.players[i])).join(' & '):'Nobody!'}</div>
<div class=panel>${order.map(i=>`<div class="bar ${w.includes(i)?'win':''}"><span>${esc(G.players[i])}</span><i style="width:${m?G.score[i]/m*100:0}%;--d:${order.indexOf(i)}"></i><b>${G.score[i]}</b></div>`).join('')}</div></div>
<button class=primary id=ag>Play again</button><button id=hm>Home</button>`;
sfx.win();buzz([30,50,30,50,80]);$('#ag').onclick=start;$('#hm').onclick=home}
home();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

</script></body></html>
